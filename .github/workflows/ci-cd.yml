# CeyPASSCihazPanel CI/CD: Build -> Zip (Release içeriği) -> update.xml -> Sunucuya kopyala
# Runner: Self-hosted (label: cihaz-panel-deploy)

name: Cihaz Panel Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # HFS üzerindeki bu projeye özel link
  UPDATE_BASE_URL: 'http://192.168.0.23/CeyPASS-CihazPanel-Updates'

jobs:
  build-and-deploy:
    runs-on: [ self-hosted, cihaz-panel-deploy ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .NET Framework projeleri için MSBuild kurulumu gerekir
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: AssemblyInfo'dan sürüm oku
        id: version
        shell: powershell
        run: |
          # Klasör yapısı: CeyPASSCihazPanel.UI\Properties\AssemblyInfo.cs
          $content = Get-Content 'CeyPASSCihazPanel.UI\Properties\AssemblyInfo.cs' -Raw
          if ($content -match 'AssemblyVersion\("([^"]+)"\)') {
            $ver = $Matches[1]
            Write-Host "Bulunan Versiyon: $ver"
            "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
            "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: NuGet Paketlerini Geri Yükle
        run: nuget restore CeyPASSCihazPanel.sln

      - name: Build Release (MSBuild)
        run: msbuild CeyPASSCihazPanel.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Zip (Release klasörü içeriği)
        id: zip
        shell: powershell
        run: |
          $version = $env:VERSION
          # .NET 8 olmadığı için yol: bin\Release
          $src = "CeyPASSCihazPanel.UI\bin\Release"
          $zipName = "CeyPASSCihazPanel.v$version.zip"
          
          if (-not (Test-Path $src)) {
            Write-Error "Build çıktısı bulunamadı: $src"
            exit 1
          }
          
          Compress-Archive -Path "$src\*" -DestinationPath $zipName -Force
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: update.xml oluştur
        shell: powershell
        run: |
          $version = $env:VERSION
          $zipName = "${{ steps.zip.outputs.zip_name }}"
          $url = "${{ env.UPDATE_BASE_URL }}/$zipName"
          $xml = "<?xml version=`"1.0`" encoding=`"UTF-8`"?><item><version>$version</version><url>$url</url><mandatory>false</mandatory></item>"
          Set-Content -Path "update.xml" -Value $xml -Encoding UTF8

      - name: Sunucuya kopyala
        shell: powershell
        run: |
          $dest = 'C:\CeyPASS-CihazPanel-Updates'
          if (-not (Test-Path $dest)) {
            New-Item -ItemType Directory -Path $dest -Force
          }
          $zipFile = "${{ steps.zip.outputs.zip_name }}"
          Copy-Item -Path $zipFile -Destination $dest -Force
          Copy-Item -Path "update.xml" -Destination $dest -Force
          Write-Host "Dağıtım tamamlandı: $dest"