# CeyPASSCihazPanel CI/CD: DLL Hazırlığı -> MSBuild -> Paketleme -> HFS
name: Cihaz Panel Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  UPDATE_BASE_URL: 'http://192.168.0.23/CeyPASS-CihazPanel-Updates'
  DEPLOY_PATH: 'C:\CeyPASS-CihazPanel-Updates'

jobs:
  build-and-deploy:
    runs-on: [ self-hosted, cihaz-panel-deploy ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Bağımlı DLL'i Hazırla (zkemkeeper)
        shell: powershell
        run: |
          # Projenin derleme sırasında DLL'i arayacağı Libs klasörünü oluşturuyoruz
          $libPath = "CeyPASSCihazPanel.UI\Libs"
          if (-not (Test-Path $libPath)) { New-Item -ItemType Directory -Path $libPath -Force }
          
          # Sunucunda zaten var olan DLL'in yolu
          $sourceDll = "C:\Windows\SysWOW64\zkemkeeper.dll" 
          
          if (Test-Path $sourceDll) {
            Copy-Item -Path $sourceDll -Destination $libPath -Force
            Write-Host "DLL başarıyla proje klasörüne kopyalandı."
          } else {
            Write-Error "DLL sunucuda bulunamadı! Yol: $sourceDll"
            exit 1
          }

      - name: NuGet Restore
        run: C:\nuget\nuget.exe restore CeyPASSCihazPanel.sln

      - name: AssemblyInfo'dan sürüm oku
        id: version
        shell: powershell
        run: |
          $path = "CeyPASSCihazPanel.UI\Properties\AssemblyInfo.cs"
          $content = Get-Content $path -Raw
          if ($content -match 'AssemblyVersion\("([^"]+)"\)') {
            $ver = $Matches[1]
            "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build Release (MSBuild)
        run: msbuild CeyPASSCihazPanel.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Zip Paketini Hazırla
        id: zip
        shell: powershell
        run: |
          $src = "CeyPASSCihazPanel.UI\bin\Release"
          $zipName = "CeyPASSCihazPanel.v$env:VERSION.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zipName -Force
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: update.xml ve Dağıtım
        shell: powershell
        run: |
          $zipName = "${{ steps.zip.outputs.zip_name }}"
          $xml = "<?xml version=`"1.0`" encoding=`"UTF-8`"?><item><version>$env:VERSION</version><url>${{ env.UPDATE_BASE_URL }}/$zipName</url><mandatory>false</mandatory></item>"
          Set-Content -Path "update.xml" -Value $xml -Encoding UTF8
          
          # HFS klasörüne taşı
          if (-not (Test-Path $env:DEPLOY_PATH)) { New-Item -ItemType Directory -Path $env:DEPLOY_PATH -Force }
          Copy-Item -Path $zipName -Destination $env:DEPLOY_PATH -Force
          Copy-Item -Path "update.xml" -Destination $env:DEPLOY_PATH -Force