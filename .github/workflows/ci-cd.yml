# CeyPASSCihazPanel CI/CD: Dinamik Yol Tespiti -> MSBuild -> Paketleme -> HFS
name: Cihaz Panel Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  UPDATE_BASE_URL: 'http://192.168.0.23/CeyPASS-CihazPanel-Updates'
  DEPLOY_PATH: 'C:\CeyPASS-CihazPanel-Updates'

jobs:
  build-and-deploy:
    runs-on: [ self-hosted, cihaz-panel-deploy ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: NuGet Restore (Dinamik Yol)
        shell: powershell
        run: |
          # .sln dosyasını tüm alt klasörlerde arayıp buluyoruz
          $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
          if ($null -eq $sln) {
            Write-Error "Depoda .sln dosyası bulunamadı!"
            exit 1
          }
          Write-Host "Bulunan Solution: $($sln.FullName)"
          # NuGet'i bulunan tam yol ile çalıştırıyoruz
          C:\nuget\nuget.exe restore "$($sln.FullName)"

      - name: AssemblyInfo'dan sürüm oku
        id: version
        shell: powershell
        run: |
          # AssemblyInfo.cs dosyasını otomatik buluyoruz
          $info = Get-ChildItem -Recurse -Filter "AssemblyInfo.cs" | Where-Object { $_.FullName -match "Properties" } | Select-Object -First 1
          $content = Get-Content $info.FullName -Raw
          if ($content -match 'AssemblyVersion\("([^"]+)"\)') {
            $ver = $Matches[1]
            "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build Release (MSBuild)
        shell: powershell
        run: |
          $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
          # MSBuild'e bulunan solution yolunu veriyoruz
          msbuild "$($sln.FullName)" /p:Configuration=Release /p:Platform="Any CPU"

      - name: Zip Paketini Hazırla
        id: zip
        shell: powershell
        run: |
          # bin\Release klasörünü otomatik buluyoruz
          $releasePath = Get-ChildItem -Recurse -Directory -Filter "Release" | Where-Object { $_.FullName -match "bin\\Release" } | Select-Object -First 1
          $zipName = "CeyPASSCihazPanel.v$env:VERSION.zip"
          Compress-Archive -Path "$($releasePath.FullName)\*" -DestinationPath $zipName -Force
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: update.xml ve Dağıtım
        shell: powershell
        run: |
          $zipName = "${{ steps.zip.outputs.zip_name }}"
          $xml = "<?xml version=`"1.0`" encoding=`"UTF-8`"?><item><version>$env:VERSION</version><url>${{ env.UPDATE_BASE_URL }}/$zipName</url><mandatory>false</mandatory></item>"
          Set-Content -Path "update.xml" -Value $xml -Encoding UTF8
          
          # HFS klasörüne taşı
          if (-not (Test-Path $env:DEPLOY_PATH)) { New-Item -ItemType Directory -Path $env:DEPLOY_PATH -Force }
          Copy-Item -Path $zipName -Destination $env:DEPLOY_PATH -Force
          Copy-Item -Path "update.xml" -Destination $env:DEPLOY_PATH -Force