name: Cihaz Panel Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  UPDATE_BASE_URL: 'http://192.168.0.23/CeyPASS-CihazPanel-Updates'

jobs:
  build-and-deploy:
    runs-on: [ self-hosted, cihaz-panel-deploy ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: NuGet Restore
        run: C:\nuget\nuget.exe restore CeyPASSCihazPanel.sln

      - name: AssemblyInfo'dan sürüm oku
        id: version
        shell: powershell
        run: |
          $content = Get-Content 'CeyPASSCihazPanel.UI\Properties\AssemblyInfo.cs' -Raw
          if ($content -match 'AssemblyVersion\("([^"]+)"\)') {
            $ver = $Matches[1]
            "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build Release
        run: msbuild CeyPASSCihazPanel.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Zip
        id: zip
        shell: powershell
        run: |
          $src = "CeyPASSCihazPanel.UI\bin\Release"
          $zipName = "CeyPASSCihazPanel.v$env:VERSION.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zipName -Force
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: update.xml ve Kopyala
        shell: powershell
        run: |
          $xml = "<?xml version=`"1.0`" encoding=`"UTF-8`"?><item><version>$env:VERSION</version><url>${{ env.UPDATE_BASE_URL }}/${{ steps.zip.outputs.zip_name }}</url><mandatory>false</mandatory></item>"
          Set-Content -Path "update.xml" -Value $xml -Encoding UTF8
          Copy-Item -Path "${{ steps.zip.outputs.zip_name }}" -Destination 'C:\CeyPASS-CihazPanel-Updates' -Force
          Copy-Item -Path "update.xml" -Destination 'C:\CeyPASS-CihazPanel-Updates' -Force