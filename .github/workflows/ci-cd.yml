name: Cihaz Panel Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # HFS üzerindeki bu projeye özel link
  UPDATE_BASE_URL: 'http://192.168.0.23/CeyPASS-CihazPanel-Updates'

jobs:
  build-and-deploy:
    # Yeni oluşturduğumuz cihaz-panel runner'ını hedefliyoruz
    runs-on: [ self-hosted, cihaz-panel-deploy ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: AssemblyInfo'dan sürüm oku
        id: version
        shell: powershell
        run: |
          # Proje klasör yapına göre yolu kontrol et: CeyPASS.CihazPanel.UI veya benzeri
          $content = Get-Content 'CeyPASSCihazPanel.UI\Properties\AssemblyInfo.cs' -Raw
          if ($content -match 'AssemblyVersion\("([^"]+)"\)') {
            $ver = $Matches[1]
            Write-Host "Bulunan Versiyon: $ver"
            "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Error "AssemblyInfo.cs içinde versiyon bulunamadı!"
            exit 1
          }

      - name: Build Release
        run: dotnet build CeyPASSCihazPanel.sln -c Release --no-incremental

      - name: Zip Paketini Hazırla
        shell: powershell
        run: |
          $version = $env:VERSION
          # Derleme çıktısının olduğu yolu kontrol et (net8.0-windows)
          $src = "CeyPASSCihazPanel.UI\bin\Release\net8.0-windows"
          $zipName = "CeyPASSCihazPanel-v$version.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: update.xml Oluştur
        shell: powershell
        run: |
          $version = $env:VERSION
          $url = "${{ env.UPDATE_BASE_URL }}/$env:ZIP_NAME"
          $xml = "<?xml version=`"1.0`" encoding=`"UTF-8`"?><item><version>$version</version><url>$url</url><mandatory>false</mandatory></item>"
          Set-Content -Path "update.xml" -Value $xml -Encoding UTF8

      - name: HFS Klasörüne Kopyala
        shell: powershell
        run: |
          $dest = 'C:\CeyPASS-CihazPanel-Updates'
          if (-not (Test-Path $dest)) { New-File -ItemType Directory -Path $dest -Force }
          # Dosyaları sunucudaki fiziksel klasöre taşıyoruz
          Copy-Item -Path "$env:ZIP_NAME" -Destination $dest -Force
          Copy-Item -Path "update.xml" -Destination $dest -Force
          Write-Host "Dağıtım $dest klasörüne başarıyla tamamlandı."